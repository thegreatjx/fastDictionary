name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: pwsh
        run: |
          $out = gofmt -l .
          if ($out) { $out; Write-Error "gofmt found unformatted files"; exit 1 }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      # The app spawns 54 goroutines over shared state. Without the detector a
      # race only shows up as a user-reported glitch after release.
      - name: go test -race
        run: go test -race ./... -count=1
